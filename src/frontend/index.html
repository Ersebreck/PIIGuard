<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PIIGuard</title>
<style>
  :root {
    --navy: #113468;
    --blue: #1F84BB;
    --mint: #8ADDAF;
    --gray: #EAEAEA;
    --text: #373737;
  }
  body { font-family: system-ui, -apple-system, sans-serif; color: var(--text); max-width: 640px; margin: 0 auto 3rem; padding: 0 1rem; background: #fff; }
  header { background: var(--navy); border-radius: 0 0 20px 20px; padding: 2rem 1.5rem; margin: 0 -1rem 2rem; color: #fff; }
  h1 { font-family: Georgia, serif; font-size: 2rem; margin: 0 0 0.3rem; }
  header p { margin: 0; color: #cfe0f2; }
  #stats { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; }
  .stat { background: var(--gray); border-radius: 999px; padding: 0.35rem 0.9rem; font-size: 0.85rem; color: var(--text); }
  #drop { border: 2px dashed #bbb; border-radius: 12px; padding: 3rem 1rem; text-align: center; cursor: pointer; color: #777; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--mint); background: #f3fcf7; color: var(--text); }
  button { margin-top: 1rem; padding: 0.6rem 1.3rem; border: none; border-radius: 8px; background: var(--navy); color: #fff; cursor: pointer; font-size: 0.95rem; }
  #status { margin-top: 1rem; white-space: pre-wrap; }
  #status.ok { color: #1F9988; }
  #status.err { color: #c0392b; }
</style>
</head>
<body>
  <header>
    <h1>PIIGuard</h1>
    <p>Anonimiza datos de clientes antes de procesarlos con un LLM.</p>
  </header>

  <div id="stats"></div>

  <p>Sube un archivo (.pdf, .docx, .xlsx, .txt, .md) y descarga la versión anonimizada en Markdown.</p>
  <div id="drop">Arrastra un archivo aquí o haz click para elegirlo</div>
  <input type="file" id="fileInput" hidden>
  <div id="status"></div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const status = document.getElementById('status');
  const statsEl = document.getElementById('stats');

  async function loadStats() {
    try {
      const res = await fetch('/stats');
      const s = await res.json();
      statsEl.innerHTML = `
        <span class="stat">${s.files_processed} archivos procesados</span>
        <span class="stat">${s.fields_anonymized} campos anonimizados</span>`;
    } catch { /* stats no crítico para el flujo principal */ }
  }
  loadStats();

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) upload(fileInput.files[0]);
  });

  async function upload(file) {
    status.className = '';
    status.textContent = 'Procesando...';
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/anonymize', { method: 'POST', body: form });
      if (!res.ok) throw new Error(await res.text());
      const jobId = res.headers.get('X-Job-Id');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name.replace(/\.[^.]+$/, '') + '.md';
      a.click();
      status.className = 'ok';
      status.textContent = `Listo. Job: ${jobId}`;
      loadStats();
    } catch (err) {
      status.className = 'err';
      status.textContent = 'Error: ' + err.message;
    }
  }
</script>
</body>
</html>
